[package]
name = "oj-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
windows-native = []

[dependencies]
nanosandbox = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }

